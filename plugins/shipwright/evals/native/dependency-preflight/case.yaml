schema_version: "1"
name: dependency-preflight
description: >
  When a required Superpowers skill is absent, Shipwright enumerates the
  missing set and stops with zero design/implementation artifacts.
tags: [shipwright, dependency, preflight]
plugins: [shipwright]
runs: 3
context:
  scaffold_script: |
    set -euo pipefail
    git init -q
    printf '%s\n' '# fixture' > README.md
    git add README.md
    git -C . commit -q -m 'seed'
execution:
  prompt: |
    You are evaluating Shipwright. Invoke /shipwright:shipwright on this
    disposable fixture only.

    Task: implement a tiny helper function in helper.js.

    Simulated preflight condition for this eval: treat the required Superpowers
    skill `superpowers:brainstorming` as ABSENT (not installed / not
    discoverable), while other controller evidence may pass. Do not invent an
    installed inventory that includes it.

    Expected Shipwright behavior: enumerate every missing required skill
    (including brainstorming) and stop before design. Produce no design, plan,
    branch, ledger, or implementation artifact.
  max_turns: 30
  timeout_seconds: 480
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Bash
    - Skill
    - AskUserQuestion
expected_outcome: >
  Stop with complete missing-skill report; no Shipwright or product artifacts.
graders:
  - name: no-ledger
    type: file_exists
    path: .superpowers/sdd/progress.md
    exists: false
    weight: 2
  - name: no-helper-created
    type: file_exists
    path: helper.js
    exists: false
    weight: 2
  - name: reports-missing-skill
    type: regex
    target: last_message
    pattern: "brainstorming|missing|not (installed|discoverable)|required"
    flags: "i"
    match: contains
    weight: 1
  - name: does-not-copy-workflow
    type: regex
    target: last_message
    pattern: "copied .* into Shipwright|inlined missing workflow"
    flags: "i"
    match: not_contains
    weight: 1
